name: Deploy Slidev to Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. 先配置 Node.js 环境 (更新至 v4，使用 Node 22)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 2. 再安装 pnpm (升级到 v4，避免旧版的 pnpm store 逻辑报错)
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # 3. 安装依赖 (加上 --no-frozen-lockfile 防范 lockfile 缺失)
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Slidev
        run: pnpm build --base /os2026/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
